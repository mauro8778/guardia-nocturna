version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: guardia_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: guardianocturna
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: guardia_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "3050:3050"
    environment:
      PORT: 3050
      NODE_ENV: production
      DATABASE_URL: "postgresql://postgres:postgrespassword@postgres:5432/guardianocturna?schema=public"
      DIRECT_URL: "postgresql://postgres:postgrespassword@postgres:5432/guardianocturna?schema=public"
      JWT_SECRET: "guardia_nocturna_jwt_secret_production_key_2026"
      FRONTEND_URL: "http://localhost:5173"
      BACKEND_URL: "http://localhost:3050"

volumes:
  postgres_data:
